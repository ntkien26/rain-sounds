allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.appcompat' && details.requested.name == 'appcompat') {
                details.useVersion '1.6.1'
            }
            if (details.requested.group == 'androidx.appcompat' && details.requested.name == 'appcompat-resources') {
                details.useVersion '1.6.1'
            }
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.appcompat:appcompat:1.6.1'
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.plugins.whenPluginAdded { plugin ->
        if (plugin.class.name.contains("LibraryPlugin")) {
            project.android {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def parsedManifest = new XmlParser().parse(manifestFile)
                    def packageName = parsedManifest.@package
                    if (packageName != null) {
                        namespace packageName
                    }
                }
                
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                
                if (project.hasProperty("kotlinOptions")) {
                    kotlinOptions {
                        jvmTarget = "17"
                    }
                }
            }
        }
    }
    
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
    
    project.tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17.toString()
        targetCompatibility = JavaVersion.VERSION_17.toString()
    }
    
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects {
    project.evaluationDependsOn(":app")
}
